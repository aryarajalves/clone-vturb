<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clone do VTurb</title>
    <!-- Script de Configuração Dinâmica em Tempo de Execução (Runtime Config) -->
    <script src="/env-config.js"></script>
    <script>
      (function() {
        var isEmbed = window.location.search.indexOf('embed=') !== -1 || window.location.pathname.indexOf('/embed/') !== -1;
        if (isEmbed) {
          document.documentElement.classList.add('embed-mode');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
